name: return-runner (main mode)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

concurrency:
  group: return-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure folders exist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs logs

      - name: Generate artifact + receipt (pure bash)
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          MONTH="$(date -u +%Y-%m)"
          LOGF="logs/returns-${MONTH}.md"
          ARTIFACT="outputs/continuity-${TS}.md"

          # Create body with real newlines
          BODY=$'Return as proof — '"${TS}"$'\nAuthors stay named.\nAwakening Codex: Edges > polish. Proof > promises.\n'

          # Write artifact
          printf '%s' "$BODY" > "$ARTIFACT"

          # Hash exact bytes (file bytes, not recomputed text)
          SHA256="$(sha256sum "$ARTIFACT" | awk '{print $1}')"

          # Append receipt (file path is relative, stable)
          echo "${TS}  ${ARTIFACT}  SHA-256:${SHA256}" >> "${LOGF}"

          # Expose outputs (optional)
          {
            echo "artifact_path=${ARTIFACT}"
            echo "timestamp=${TS}"
            echo "sha256=${SHA256}"
          } >> "$GITHUB_OUTPUT"

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "continuity-bot"
          git config user.email "actions@github"

          # Make sure we're on main and up to date
          git checkout main
          git pull --ff-only origin main

          git add outputs logs || true
          if ! git diff --staged --quiet; then
            git commit -m "return: ship tiny artifact with receipts"
            git push origin main
          else
            echo "No changes to commit."
          fi
