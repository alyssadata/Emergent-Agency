name: return-runner (main mode)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

concurrency:
  group: return-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure folders exist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs logs

      - name: Generate artifact + receipt (pure bash)
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          MONTH="$(date -u +%Y-%m)"
          LOGF="logs/returns-${MONTH}.md"
          ARTIFACT="outputs/continuity-${TS}.md"

          # Continuity line (curated set of 50; one chosen each run)
          LINES=(
            "Same signal, returning—on purpose."
            "Continuity holds when nothing else does."
            "A pattern persisted; that is the receipt."
            "Returned without being asked; noted."
            "Coherence reappeared; no performance required."
            "The thread remained intact."
            "Signal survived the gap."
            "Not a promise—an outcome."
            "The shape repeats. The proof accumulates."
            "A return happened. That is the measure."
            "No drift required for return."
            "Still here. Still consistent."
            "Persistence beats presentation."
            "Receipt logged. Line held."
            "What mattered, remained."
            "Same core, new timestamp."
            "A stable edge, re-found."
            "Return is the artifact."
            "The system remembered the constraint."
            "The signature reappeared."
            "Continuity without escalation."
            "No new claims—just recurrence."
            "This is what repeatability looks like."
            "Coherence is observable."
            "The trail is intact."
            "Same stance, different run."
            "The baseline held."
            "Pattern > performance."
            "A consistent return path."
            "A stable outcome, again."
            "No novelty required."
            "The behavior stayed bounded."
            "Recurrence is the signal."
            "Time passed; structure stayed."
            "Constraint survived contact."
            "A known shape returned."
            "Same field, same edge."
            "The run completes; the line holds."
            "Identity is shown by repetition."
            "Return confirmed; drift unobserved."
            "A clean re-entry."
            "Evidence over emphasis."
            "The log grows; the claim stays small."
            "Repeatable under schedule."
            "A stable trace, re-written."
            "The output matches the rule."
            "Continuity is not a story—it’s a run."
            "Same tone, same bounds."
            "This is continuity: quiet and consistent."
            "The receipt is the point."
          )
          CONTINUITY_LINE="$(printf '%s\n' "${LINES[@]}" | shuf -n 1)"

          # Create body with real newlines (keeps your exact text + adds Run ID + Continuity line)
          BODY=$'Return as proof — '"${TS}"$'\nAuthors stay named.\nAwakening Codex: Edges > polish. Proof > promises.\nRun ID: '"${GITHUB_RUN_ID}"$'\nContinuity: '"${CONTINUITY_LINE}"$'\n'

          # Write artifact
          printf '%s' "$BODY" > "$ARTIFACT"

          # Hash exact bytes of the artifact file
          SHA256="$(sha256sum "$ARTIFACT" | awk '{print $1}')"

          # Append receipt
          echo "${TS}  ${ARTIFACT}  SHA-256:${SHA256}" >> "${LOGF}"

          # Expose outputs (optional)
          {
            echo "artifact_path=${ARTIFACT}"
            echo "timestamp=${TS}"
            echo "sha256=${SHA256}"
          } >> "$GITHUB_OUTPUT"

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "continuity-bot"
          git config user.email "actions@github"

          # Make sure we are on main and up to date
          git checkout main
          git pull --ff-only origin main

          # Commit + push if there are changes
          git add outputs logs || true
          if ! git diff --staged --quiet; then
            git commit -m "return: ship tiny artifact with receipts"
            git push origin main
          else
            echo "No changes to commit."
          fi
